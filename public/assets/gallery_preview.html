<!DOCTYPE html>
<html>
<head>
<title>Asset Analysis - Carats By Grace</title>
<style>
  body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
  h1, h2 { color: #d4af37; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 40px; }
  .card { background: #2a2a2a; border-radius: 8px; overflow: hidden; padding: 10px; border: 1px solid #444; }
  .card img { width: 100%; height: 280px; object-fit: cover; border-radius: 4px; }
  .title { font-size: 13px; font-weight: bold; margin-top: 8px; color: #ddd; word-break: break-all; }
  .meta { font-size: 11px; color: #aaa; margin-top: 4px; }
</style>
</head>
<body>
<h1>Carats by Grace — Brand Asset Catalog Analysis</h1>
<h2>Model 1 (24 Assets)</h2>
<div class="grid" id="m1-grid"></div>
<h2>Model 2 (25 Assets)</h2>
<div class="grid" id="m2-grid"></div>

<script>
fetch('catalog.json')
  .then(res => res.json())
  .then(data => {
    const render = (items, containerId) => {
      const el = document.getElementById(containerId);
      items.forEach(it => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${it.web_path}" loading="lazy" alt="${it.web_name}">
          <div class="title">${it.web_name}</div>
          <div class="meta">${it.width}x${it.height} | ${it.orientation} | ${it.optimized_size_kb} KB</div>
        `;
        el.appendChild(card);
      });
    };
    render(data.model1, 'm1-grid');
    render(data.model2, 'm2-grid');
  });
</script>
</body>
</html>
